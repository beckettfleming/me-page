<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>admin — projects (unlinked)</title>
<style>
:root{
  --bg-0:#0a0a0d;--bg-1:#101014;--bg-2:#16161c;--surface-card:#17171d;--surface-raised:#1c1c23;
  --border-1:#26262f;--border-2:#34343f;
  --fg-0:#f4f4f6;--fg-1:#a3a3ad;--fg-2:#6b6b76;
  --accent-400:#8c7dff;--accent-500:#6a5cff;--accent-600:#5245d1;--accent-glow:rgba(106,92,255,.35);
  --success:#2ee6a8;--warning:#ffb02e;--danger:#ff5c5c;--info:var(--accent-500);
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --radius-md:4px;--radius-lg:8px;--radius-pill:999px;
  --shadow-md:0 4px 16px rgba(0,0,0,.45);--shadow-focus:0 0 0 3px var(--accent-glow);
}
*{box-sizing:border-box}
body{background:var(--bg-1);color:var(--fg-0);margin:0;font-family:var(--font-mono);font-weight:400}
a{color:var(--accent-400);text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px}
h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin:0}
.sub{color:var(--fg-2);font-size:13px;margin-bottom:32px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.count{color:var(--fg-2);font-size:13px}
button{font-family:var(--font-mono);cursor:pointer;border-radius:var(--radius-md);border:1px solid var(--border-2);background:var(--surface-raised);color:var(--fg-0);padding:8px 14px;font-size:13px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent-500);background:var(--bg-2)}
button:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.btn-primary{background:var(--accent-500);border-color:var(--accent-500);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--accent-600);border-color:var(--accent-600)}
.btn-danger{border-color:var(--border-2);color:var(--fg-1)}
.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:rgba(255,92,92,.08)}
.grid{display:grid;gap:12px}
.card{background:var(--surface-card);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:16px 18px;display:flex;align-items:center;gap:16px;transition:border-color .15s}
.card:hover{border-color:var(--border-2)}
.card-thumb{width:48px;height:48px;flex-shrink:0;border-radius:var(--radius-md);object-fit:cover;border:1px solid var(--border-1);background:var(--bg-0)}
.card-thumb-empty{width:48px;height:48px;flex-shrink:0;border-radius:var(--radius-md);border:1px solid var(--border-1);background:var(--bg-0);color:var(--fg-2);font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center}
.card-main{flex:1;min-width:0}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.card-id{font-weight:700;font-size:14px}
.badge{font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);border:1px solid var(--border-2);color:var(--fg-1);text-transform:lowercase;letter-spacing:.02em}
.tone-success{color:var(--success);border-color:var(--success)}
.tone-warning{color:var(--warning);border-color:var(--warning)}
.tone-danger{color:var(--danger);border-color:var(--danger)}
.tone-neutral{color:var(--fg-1);border-color:var(--border-2)}
.card-desc{color:var(--fg-1);font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:8px;flex-shrink:0}
.card-actions button{padding:6px 12px;font-size:12px}
.empty{color:var(--fg-2);font-size:13px;padding:32px 0;text-align:center;border:1px dashed var(--border-2);border-radius:var(--radius-lg)}

.overlay{position:fixed;inset:0;background:rgba(10,10,13,.7);display:none;align-items:center;justify-content:center;padding:24px;z-index:100}
.overlay.open{display:flex}
.modal{background:var(--surface-raised);border:1px solid var(--border-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);width:100%;max-width:440px;padding:24px}
.modal h2{font-size:16px;font-weight:700;margin:0 0 18px}
label{display:block;font-size:12px;color:var(--fg-1);margin-top:14px;margin-bottom:6px}
input,textarea,select{width:100%;background:var(--bg-0);border:1px solid var(--border-1);border-radius:var(--radius-md);color:var(--fg-0);padding:9px 10px;font-family:var(--font-mono);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent-500);box-shadow:var(--shadow-focus)}
textarea{resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.modal-actions button{padding:8px 16px}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:8px}
.image-thumb{position:relative;width:100%;aspect-ratio:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-1);background:var(--bg-0)}
.image-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.image-thumb .removeImg{position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;font-size:11px;line-height:1;border-radius:50%;background:rgba(10,10,13,.8);border:1px solid var(--border-2);color:var(--fg-0);display:flex;align-items:center;justify-content:center}
.image-thumb .removeImg:hover{border-color:var(--danger);color:var(--danger)}
.image-uploading{font-size:11px;color:var(--fg-2);grid-column:1/-1}
.upload-label{display:inline-block;font-size:12px;padding:8px 14px;border:1px dashed var(--border-2);border-radius:var(--radius-md);color:var(--fg-1);cursor:pointer;text-align:center;width:100%;margin-top:6px}
.upload-label:hover{border-color:var(--accent-500);color:var(--fg-0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>admin / projects</h1>
  </header>
  <div class="sub">unlinked from the site — add, edit, or remove portfolio entries</div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <button class="btn-primary" id="newBtn">+ new project</button>
  </div>

  <div id="list" class="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">new project</h2>
    <form id="form">
      <label>id</label>
      <input name="id" id="idField" required>
      <label>kind</label>
      <select name="kind">
        <option value="game">game</option>
        <option value="tool">tool</option>
        <option value="other">other</option>
      </select>
      <label>tone</label>
      <select name="tone">
        <option value="neutral">neutral</option>
        <option value="success">success</option>
        <option value="warning">warning</option>
        <option value="danger">danger</option>
      </select>
      <label>desc</label>
      <textarea name="desc" rows="3"></textarea>
      <label>images</label>
      <div class="image-grid" id="imageGrid"></div>
      <label class="upload-label" id="uploadLabel">+ add image(s)
        <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
      </label>
      <div class="modal-actions">
        <button type="button" id="cancelBtn">cancel</button>
        <button type="submit" class="btn-primary">save</button>
      </div>
    </form>
  </div>
</div>

<script>
let projects = [];
let editingId = null;
let currentImages = [];

const list = document.getElementById('list');
const count = document.getElementById('count');
const overlay = document.getElementById('overlay');
const form = document.getElementById('form');
const modalTitle = document.getElementById('modalTitle');
const idField = document.getElementById('idField');
const imageGrid = document.getElementById('imageGrid');
const imageInput = document.getElementById('imageInput');

async function load(){
  const res = await fetch('/api/projects');
  projects = await res.json();
  render();
}

function render(){
  count.textContent = projects.length + (projects.length === 1 ? ' project' : ' projects');
  list.innerHTML = '';
  if (!projects.length){
    list.innerHTML = '<div class="empty">no projects yet</div>';
    return;
  }
  projects.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'card';
    const tone = p.tone || 'neutral';
    const thumbUrl = Array.isArray(p.images) && p.images[0];
    el.innerHTML = `
      ${thumbUrl ? `<img class="card-thumb" src="${escapeHtml(thumbUrl)}" alt="">` : `<div class="card-thumb-empty">no img</div>`}
      <div class="card-main">
        <div class="card-top">
          <span class="card-id">${escapeHtml(p.id)}</span>
          ${p.kind ? `<span class="badge">${escapeHtml(p.kind)}</span>` : ''}
          <span class="badge tone-${escapeHtml(tone)}">${escapeHtml(tone)}</span>
        </div>
        <div class="card-desc">${escapeHtml(p.desc || '')}</div>
      </div>
      <div class="card-actions">
        <button class="editBtn">edit</button>
        <button class="btn-danger deleteBtn">delete</button>
      </div>
    `;
    el.querySelector('.editBtn').onclick = () => openModal(p);
    el.querySelector('.deleteBtn').onclick = () => removeProject(p.id);
    list.appendChild(el);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderImageGrid(){
  imageGrid.innerHTML = '';
  currentImages.forEach((url, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'image-thumb';
    thumb.innerHTML = `<img src="${escapeHtml(url)}" alt=""><button type="button" class="removeImg">&times;</button>`;
    thumb.querySelector('.removeImg').onclick = () => {
      currentImages.splice(i, 1);
      renderImageGrid();
    };
    imageGrid.appendChild(thumb);
  });
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

imageInput.addEventListener('change', async () => {
  const files = Array.from(imageInput.files || []);
  imageInput.value = '';
  if (!files.length) return;
  const note = document.createElement('div');
  note.className = 'image-uploading';
  note.textContent = `uploading ${files.length} image(s)...`;
  imageGrid.appendChild(note);
  for (const file of files){
    try{
      const dataUrl = await fileToDataUrl(file);
      const res = await fetch('/api/upload', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ data: dataUrl }) });
      const out = await res.json();
      if (res.ok && out.url) currentImages.push(out.url);
      else alert(`error uploading ${file.name}: ${out.error || 'unknown error'}`);
    } catch(err){
      alert(`error uploading ${file.name}`);
    }
  }
  renderImageGrid();
});

function openModal(p){
  form.reset();
  if (p){
    editingId = p.id;
    modalTitle.textContent = 'edit project';
    idField.value = p.id;
    idField.readOnly = true;
    form.kind.value = p.kind || 'game';
    form.tone.value = p.tone || 'neutral';
    form.desc.value = p.desc || '';
    currentImages = Array.isArray(p.images) ? [...p.images] : [];
  } else {
    editingId = null;
    modalTitle.textContent = 'new project';
    idField.readOnly = false;
    currentImages = [];
  }
  renderImageGrid();
  overlay.classList.add('open');
  idField.focus();
}

function closeModal(){
  overlay.classList.remove('open');
}

document.getElementById('newBtn').onclick = () => openModal(null);
document.getElementById('cancelBtn').onclick = closeModal;
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    id: form.id.value.trim(),
    kind: form.kind.value.trim(),
    tone: form.tone.value,
    desc: form.desc.value.trim(),
    images: currentImages
  };
  const res = await fetch('/api/project', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(data) });
  if (res.ok){
    closeModal();
    await load();
  } else {
    alert('error saving project');
  }
});

async function removeProject(id){
  if (!confirm(`delete "${id}"?`)) return;
  const next = projects.filter(p => p.id !== id);
  const res = await fetch('/api/projects', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(next) });
  if (res.ok){
    await load();
  } else {
    alert('error deleting project');
  }
}

load();
</script>
</body>
</html>
