<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin — Projects (unlinked)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;margin:24px;color:#111}
    label{display:block;margin-top:8px}
    input,textarea{width:100%;padding:8px;margin-top:4px}
    .row{display:flex;gap:8px}
    .row>div{flex:1}
    .list{margin-top:12px}
    .item{padding:8px;border:1px solid #ddd;margin-bottom:6px}
    button{padding:8px 12px}
  </style>
</head>
<body>
  <h1>Admin — Projects</h1>
  <p>This page is intentionally unlinked from the site. Use it to add or edit projects.</p>

  <div id="list" class="list">Loading…</div>

  <h2 id="formTitle">Add / Edit Project</h2>
  <form id="form">
    <label>id<input name="id" required></label>
    <label>kind<input name="kind"></label>
    <label>tone<input name="tone"></label>
    <label>desc<textarea name="desc" rows="3"></textarea></label>
    <div style="margin-top:8px"><button type="submit">Save</button></div>
  </form>

  <script>
    async function load(){
      const res = await fetch('/api/projects');
      const projects = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      projects.forEach(p=>{
        const el = document.createElement('div'); el.className='item';
        el.innerHTML = `<strong>${p.id}</strong> <em>(${p.kind||''})</em><div>${p.desc||''}</div>`;
        const btn = document.createElement('button'); btn.textContent='Edit';
        btn.onclick = ()=>{ fillForm(p); };
        el.appendChild(btn);
        list.appendChild(el);
      });
    }
    function fillForm(p){
      const f = document.getElementById('form');
      f.id.value = p.id; f.kind.value = p.kind||''; f.tone.value = p.tone||''; f.desc.value = p.desc||'';
      document.getElementById('formTitle').textContent = 'Edit Project';
    }
    document.getElementById('form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const f = e.target;
      const data = { id: f.id.value.trim(), kind: f.kind.value.trim(), tone: f.tone.value.trim(), desc: f.desc.value.trim() };
      const res = await fetch('/api/project', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(data) });
      if (res.ok) { alert('Saved'); load(); f.reset(); document.getElementById('formTitle').textContent='Add / Edit Project'; }
      else { alert('Error'); }
    });
    load();
  </script>
</body>
</html>
